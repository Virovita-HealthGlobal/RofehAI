server {
    listen 80;
    server_name rofehai.com www.rofehai.com;
    root /usr/share/nginx/html/marketing;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    server_name app.rofehai.com _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
