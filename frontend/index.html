<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RofehAI — Mission Health Dashboard</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="css/styles.css" />
<script src="js/vendor/chart.umd.js"></script>
<script>
  // Gate guard: redirect to gate.html unless this browser session already
  // passed it. This is a soft, session-scoped check for a link-shared demo,
  // not a real per-user auth system -- see gate.html / README.
  if (sessionStorage.getItem("rofehai_gate_passed") !== "1") {
    window.location.href = "gate.html";
  }
</script>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="topbar-brand">
        <img class="brand-mark" src="assets/icon.png" alt="RofehAI" />
        <div>
          <div class="brand-name">RofehAI</div>
          <div class="brand-tag">your physician, everywhere</div>
        </div>
      </div>
      <div class="topbar-mission">
        <div class="mission-name" id="mission-name">—</div>
        <div class="mission-day">MISSION DAY <span id="mission-day-value">—</span></div>
      </div>
      <div class="topbar-status" id="system-status">
        <a href="gate.html" style="color:var(--text-2); text-decoration:none; margin-right:16px; border-bottom:1px dotted var(--text-3);">About / how to use</a>
        <a href="#" id="signout-link" style="color:var(--text-2); text-decoration:none; margin-right:16px; border-bottom:1px dotted var(--text-3);">Sign out</a>
        <span class="status-dot status-dot--nominal"></span> demo data — synthetic
      </div>
    </header>

    <div class="body">
      <aside class="roster" aria-label="Crew roster">
        <div class="roster-heading">Crew</div>
        <ul class="roster-list" id="roster-list"><!-- populated by app.js --></ul>
      </aside>

      <main class="detail" id="detail-panel">
        <div class="empty-state">Select a crew member to view their risk trajectory.</div>
      </main>
    </div>

    <footer class="footer">
      RofehAI reference implementation &middot; running on synthetic demo data &middot;
      decision-support output only — not a diagnosis, human review required
    </footer>
  </div>

  <script>
    document.getElementById("signout-link").addEventListener("click", (e) => {
      e.preventDefault();
      sessionStorage.removeItem("rofehai_gate_passed");
      window.location.href = "gate.html";
    });
  </script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
