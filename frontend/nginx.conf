server {
    listen 80;
    server_name rofehai.com www.rofehai.com;
    root /usr/share/nginx/html/marketing;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    server_name app.rofehai.com _;
    root /usr/share/nginx/html;
    index index.html;

    # JS/CSS must always be revalidated with the server, never served
    # from a browser/proxy cache without a check -- a stale api.js was
    # served from browser cache during live testing (2026-09-29), even in
    # a fresh incognito window, causing new backend features to silently
    # not run client-side. no-cache still lets the browser keep a local
    # copy, but forces a conditional GET (ETag/If-Modified-Since) every
    # time, so a rebuilt file is picked up on the very next load.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
