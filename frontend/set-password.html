<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RofehAI — Set your password</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .gate-wrap { max-width: 480px; margin: 0 auto; padding: 80px 24px; }
  .gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px 36px; }
  .gate-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .gate-logo img { width: 36px; height: 36px; }
  .gate-logo .name { font-weight: 600; font-size: 19px; }
  .gate-p { font-size: 14px; line-height: 1.6; color: var(--text-2); margin: 0 0 22px; }
  .gate-input {
    width: 100%; font-family: var(--font-mono); font-size: 14px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-1); padding: 10px 12px; margin-bottom: 12px; box-sizing: border-box;
  }
  .gate-input.code-input { text-align: center; font-size: 22px; letter-spacing: 6px; }
  label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; margin-top: 4px; }
  .gate-error { color: var(--status-critical); font-size: 13px; margin-bottom: 12px; display: none; }
  .gate-success { color: var(--status-nominal); font-size: 14px; margin-bottom: 16px; display: none; }
  .gate-btn {
    width: 100%; font-family: var(--font-sans); font-size: 14px; font-weight: 600;
    background: var(--accent); color: #0A1020; border: none; border-radius: 6px; padding: 12px; cursor: pointer;
  }
  .gate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="gate-wrap">
    <div class="gate-card">
      <div class="gate-logo">
        <img src="assets/icon.png" alt="RofehAI" />
        <span class="name">RofehAI</span>
      </div>

      <form id="set-password-form">
        <p class="gate-p">Enter the email you signed up with, the 6-digit code from your email, and your new password.</p>

        <label for="set-email">Email</label>
        <input class="gate-input" id="set-email" type="text" autocomplete="username" required />

        <label for="set-code">6-digit code</label>
        <input class="gate-input code-input" id="set-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />

        <label for="new-password">New password</label>
        <input class="gate-input" id="new-password" type="password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8" />

        <label for="confirm-password">Confirm password</label>
        <input class="gate-input" id="confirm-password" type="password" autocomplete="new-password" required />

        <div class="gate-error" id="set-password-error"></div>
        <div class="gate-success" id="set-password-success">Password set. Redirecting you to sign in…</div>
        <button class="gate-btn" type="submit" id="set-password-submit">Set password</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const formEl = document.getElementById("set-password-form");
    const errorEl = document.getElementById("set-password-error");
    const successEl = document.getElementById("set-password-success");
    const submitBtn = document.getElementById("set-password-submit");

    // Digits only, as they type -- avoids a common mobile-keyboard mistake
    // where a stray space or letter gets pasted alongside the code.
    document.getElementById("set-code").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      const email = document.getElementById("set-email").value.trim();
      const code = document.getElementById("set-code").value.trim();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Passwords don't match.";
        errorEl.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Setting password…";
      try {
        const res = await fetch(`${window.ROFEHAI_CONFIG.API_BASE}/auth/set-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, code, new_password: newPassword }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || "Something went wrong. Please try again.";
          errorEl.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Set password";
          return;
        }
        formEl.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
        successEl.style.display = "block";
        setTimeout(() => { window.location.href = "gate.html"; }, 1800);
      } catch (err) {
        errorEl.textContent = "Something went wrong. Please try again.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Set password";
      }
    });
  </script>
</body>
</html>
