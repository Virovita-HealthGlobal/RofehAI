services:
  backend:
    build: ./backend
    ports:
      - "8900:8000"
    volumes:
      - rofehai_db_data:/app/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - NIGHTSHIFT_API_KEY=${NIGHTSHIFT_API_KEY:-}
      - NIGHTSHIFT_BASE_URL=${NIGHTSHIFT_BASE_URL:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ROFEHAI_AGENT_DAILY_LIMIT=${ROFEHAI_AGENT_DAILY_LIMIT:-}
      - ROFEHAI_GATE_CODE=${ROFEHAI_GATE_CODE:-}
      - ROFEHAI_API_KEY=${ROFEHAI_API_KEY:-}
      - ROFEHAI_DATABASE_URL=${ROFEHAI_DATABASE_URL:-}
      - ROFEHAI_ADMIN_KEY=${ROFEHAI_ADMIN_KEY:-}
      - ROFEHAI_SMTP_HOST=smtp.hostinger.com
      - ROFEHAI_SMTP_PORT=587
      - ROFEHAI_SMTP_USERNAME=gminlend1@rofehai.com
      - ROFEHAI_SMTP_PASSWORD=Noella0824@@@
      - ROFEHAI_ADMIN_NOTIFY_EMAIL=gminlend1@rofehai.com
      - ZETARIS_ENDPOINT=https://update-banish-decent.ngrok-free.dev
      - ZETARIS_API_KEY=akngve8w51z809t9ma6au2dqdl6upufxhc6axf9iugo1aa9hsmvicpp2tnig
      - ZETARIS_ORG_ID=1
      - ROFEHAI_PUBLIC_API_BASE=${ROFEHAI_PUBLIC_API_BASE:-}
      - ROFEHAI_PUBLIC_APP_BASE=${ROFEHAI_PUBLIC_APP_BASE:-}

  frontend:
    build: ./frontend
    ports:
      - "8901:80"
    depends_on:
      - backend

volumes:
  rofehai_db_data:
    # Persists the SQLite database (accounts, alerts, conversations, etc.)
    # across container rebuilds. Without this, every `docker compose
    # build` wipes the database completely -- a real bug that existed
    # all day before this fix, silently resetting every account created.
