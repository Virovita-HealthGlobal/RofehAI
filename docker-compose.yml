services:
  backend:
    build: ./backend
    ports:
      - "8900:8000"
    volumes:
      - rofehai_db_data:/app/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ROFEHAI_AGENT_DAILY_LIMIT=${ROFEHAI_AGENT_DAILY_LIMIT:-}
      - ROFEHAI_GATE_CODE=${ROFEHAI_GATE_CODE:-}
      - ROFEHAI_API_KEY=${ROFEHAI_API_KEY:-}
      - ROFEHAI_DATABASE_URL=${ROFEHAI_DATABASE_URL:-}
      - ROFEHAI_ADMIN_KEY=${ROFEHAI_ADMIN_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ROFEHAI_ADMIN_NOTIFY_EMAIL=${ROFEHAI_ADMIN_NOTIFY_EMAIL:-}
      - ROFEHAI_NOTIFY_FROM_EMAIL=${ROFEHAI_NOTIFY_FROM_EMAIL:-}
      - ROFEHAI_PUBLIC_API_BASE=${ROFEHAI_PUBLIC_API_BASE:-}
      - ROFEHAI_PUBLIC_APP_BASE=${ROFEHAI_PUBLIC_APP_BASE:-}

  frontend:
    build: ./frontend
    ports:
      - "8901:80"
    depends_on:
      - backend

volumes:
  rofehai_db_data:
    # Persists the SQLite database (accounts, alerts, conversations, etc.)
    # across container rebuilds. Without this, every `docker compose
    # build` wipes the database completely -- a real bug that existed
    # all day before this fix, silently resetting every account created.
